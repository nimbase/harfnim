name: test
on: [push, pull_request]
jobs:
  test:
    uses: nimbase/setup-nim-action/.github/workflows/test_clue.yml@main
    with:
      nim-version: stable
      pre-test-command: |
        clue install
        clue build tools/hr_shape.nim --out:/tmp/hr-shape
        clue build tools/conformance.nim --out:/tmp/conformance
